[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vecta-agent"
version = "0.4.1"
description = "Stateless backup agent for the Vecta platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vecta_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
