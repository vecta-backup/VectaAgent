[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vecta-agent"
version = "0.2.0"
description = "Stateless backup agent for the Vecta platform"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tomli>=1.2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vecta_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
