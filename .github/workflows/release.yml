name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: /opt/python/cp312-cp312/bin/python -m pip install pyinstaller -r requirements.txt

      - name: Build binary
        run: /opt/python/cp312-cp312/bin/python -m PyInstaller vecta-agent.spec

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vecta-agent > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vecta-agent
            dist/SHA256SUMS
          generate_release_notes: true
