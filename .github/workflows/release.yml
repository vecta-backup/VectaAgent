name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.10 python3.10-venv python3.10-dev binutils curl
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.10
          rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: python3.10 -m pip install pyinstaller -r requirements.txt

      - name: Build binary
        run: python3.10 -m PyInstaller vecta-agent.spec

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vecta-agent > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vecta-agent
            dist/SHA256SUMS
          generate_release_notes: true
