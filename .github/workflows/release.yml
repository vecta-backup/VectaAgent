name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Pin apt to a snapshot.debian.org timestamp so the Release files
          # cannot expire out from under us again (the root cause that used to
          # be papered over with global Acquire::Check-Valid-Until/Check-Date
          # bypasses). Verified: bullseye main's Release file carries no
          # Valid-Until, but bullseye-security's does (7-day window), so the
          # expiry bypass is scoped to the security source only.
          SNAPSHOT_TS=20260911T000000Z
          cat > /etc/apt/sources.list <<EOF
          deb https://snapshot.debian.org/archive/debian/${SNAPSHOT_TS}/ bullseye main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/${SNAPSHOT_TS}/ bullseye-security main
          EOF
          # Primary path: the pinned snapshot above. snapshot.debian.org is
          # slow and rate-limited; if apt-get update fails or times out, fall
          # back to the live mirror with the old expiry bypasses. This is a
          # fallback, not the primary path.
          if ! apt-get update; then
            printf '%s\n' \
              'deb http://deb.debian.org/debian bullseye main' \
              'deb http://security.debian.org/debian-security bullseye-security main' \
              > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false update
          fi
          apt-get install -y binutils && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build binary
        run: pyinstaller vecta-agent.spec

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vecta-agent > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vecta-agent
            dist/SHA256SUMS
          generate_release_notes: true
